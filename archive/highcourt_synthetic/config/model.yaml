# Behaviour model: every number the simulator, the synthetic court and the planner assume
# about people. Replace with values fitted to the organisers' hearing-failure data.

advocates:
  mix: {diligent: 0.4, busy: 0.4, chronic: 0.2}
  base_show: {diligent: 0.9, busy: 0.6, chronic: 0.35}
  confirm_rate: {diligent: 0.85, busy: 0.6, chronic: 0.3}     # reply "ready" to the T-2 intent check
  prepared: {diligent: 0.9, busy: 0.7, chronic: 0.5}           # come prepared when not confirmed
  prepared_if_confirmed: 0.95
  cover_sheet_rate: {diligent: 0.9, busy: 0.6, chronic: 0.3}   # file a cover sheet when asked
  party_in_person_show: 0.8

# Change in show-up probability (percentage points) caused by the situation
show_effects:
  fixed_slot: 0.15
  bundled: 0.10          # 2+ matters of the same advocate in one window
  confirmed: 0.20
  per_clash: -0.10       # each listing in another court the same day
  costs_warning_busy: 0.15
  waitlist_call_factor: 0.6   # called from the waitlist at short notice
  floor: 0.02
  ceiling: 0.98

# P(effective | both sides present) = (base + slope * prereq_done) * preparedness * old_case_factor
effective:
  base: 0.1
  prereq_slope: 0.8
  old_unsummarised_factor: 0.5     # 4+ year case without a cover sheet
  old_unsummarised_overrun: 1.3    # and it takes 30% longer

durations:
  lognormal_sigma: 0.3
  adjourn_minutes: 2

# Pre-filing check: what an uncaught defect does to a hearing
defects:
  share_with_critical: 0.25        # filings with at least one critical defect when nobody checks
  critical_fail_rate: 0.6          # a hearing with an uncaught critical defect is not effective this often
  caught_by_prefiling: 0.9         # share of critical defects the pre-filing check catches before listing
  fix_working_days: 3              # advocate fixes a caught defect and re-files within this many working days

case_mix:
  age_buckets:                     # years, share. Manual: a quarter under 1 year, 1 in 6 over 4
    - [0, 1, 0.25]
    - [1, 2, 0.30]
    - [2, 4, 0.28]
    - [4, 5, 0.07]
    - [5, 12, 0.10]
  urgent_share: 0.03
  prereq_ready_share: 0.45
  new_filings_per_day: 4
  new_urgent_share: 0.15

baseline:                          # "today's rules" in the manual's case study
  listed_per_day: 60
  flat_gap_working_days: 42        # 60 calendar days
  carry_over_working_days: 5       # Sehgal: same weekday next week
