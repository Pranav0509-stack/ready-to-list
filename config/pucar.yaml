# Running Ready-to-List on the organisers' data (Kerala district-court pilot, anonymised).
# Every number the engine assumes beyond their CSVs is here, with the reason.

court_day:
  blocks:                                   # sitting 10:30-12:30, lunch 12:30-13:30, sitting 13:30-17:00
    - {name: Morning, start: "10:30", end: "12:30",
       purposes: [ADMISSION, COGNIZANCE, APPEARANCE, WARRANT, PLEA, BAIL, DELAY_CONDONATION_HEARING, REPORTS, APPLICATION_REVIEW]}
    - {name: Afternoon, start: "13:30", end: "17:00",
       purposes: [EXAMINATION_UNDER_S351_BNSS, EVIDENCE_COMPLAINANT, EVIDENCE_ACCUSED, ARGUMENTS, JUDGEMENT]}
  scoring_capacity_minutes: 330             # the organisers' README scores against 420; run with --capacity 420 to compare
  opening_minutes: 15                       # pronouncements, mentions
  changeover_same: 1
  changeover_switch: 3
  adjourned_minutes: 2                      # calling a matter and adjourning it still takes time
  fill_target: 0.95
  duration_sigma: 0.35                      # spread around the organisers' estimated minutes

# The main flow of a summary/sessions trial; side purposes return to the flow
stage_flow: [ADMISSION, COGNIZANCE, APPEARANCE, PLEA, EXAMINATION_UNDER_S351_BNSS, EVIDENCE_COMPLAINANT,
             EVIDENCE_ACCUSED, ARGUMENTS, JUDGEMENT]
side_purposes: [WARRANT, BAIL, REPORTS, APPLICATION_REVIEW, DELAY_CONDONATION_HEARING]
priority: {BAIL: 100, JUDGEMENT: 70, ARGUMENTS: 60, EVIDENCE_ACCUSED: 50, EVIDENCE_COMPLAINANT: 50,
           EXAMINATION_UNDER_S351_BNSS: 45, PLEA: 45, COGNIZANCE: 40, ADMISSION: 40, APPEARANCE: 30,
           WARRANT: 25, DELAY_CONDONATION_HEARING: 30, REPORTS: 20, APPLICATION_REVIEW: 30}
urgent_purposes: [BAIL]

# Failure reasons (their hearing_failure_reasons.csv columns) grouped by what can prevent them
reason_groups:
  process: [Awaiting Process / Summons / Warrant Return]
  absence: [Respondent Absence / Non-Compliance, Petitioner Absence / Non-Compliance, Both Parties Unready / Absent]
  unready: [Party Sought Time / Adjournment, Evidence / Filing Not Ready]
  court: [Court Administrative Issue, Court Holiday / No Sitting, External Dependency]
  unclear: [Unclear]

# What each Ready-to-List lever does to a group of failures (share removed). Sources for the
# direction: our agent model (fixed slot +15 pts, confirmation +20 pts, bundling +10 pts show-up).
levers:
  process_tracking:      # list only once the process-return status says served/executed
    group: process
    status_accuracy: 0.9
  intent_check:          # T-2 confirmation: unready parties say so and are not listed
    group: unready
    removed: 0.5
  fixed_slot_cluster:    # a real time window and all of an advocate's matters together
    group: absence
    removed: 0.35
  text_signals:          # read the last hearing's note: who was absent, what is awaited
    boost: 2.5           # multiply a failure group's risk when the note signals it

# Keywords in the last hearing's note, and which risk they signal
signals:
  process: ["warrant", "summons", "nbw", "notice", "await", "return of", "process", "steps"]
  unready: ["not ready", "time sought", "time", "objections", "last chance", "adjourn"]
  absence_accused: ["absent: accused"]

next_date:
  baseline_gap_days: 60                  # the case study's flat default
  after_failure_days: {process: 21, absence: 7, unready: 10, court: 1, unclear: 7}

ageing_quota: 0.25                       # locked: share of each day's minutes for 4+ year cases
old_years: 4
baseline_listed_per_day: 60
