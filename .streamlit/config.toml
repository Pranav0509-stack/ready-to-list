# Ready-to-List design tokens.
# Grounded in the court's own vernacular: the printed cause list. Ink on cool paper,
# a serif for case titles and headings the way a cause list or judgment is set, a clean
# sans for data. Noto is chosen because it covers Indian scripts, so Hindi and Malayalam
# notices render in the same family. Colour carries meaning only: one court-blue for
# action, the validated chart palette for data, status colours for warnings.

[theme]
base = "light"
font = "Noto Sans:https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600&display=swap"
headingFont = "Noto Serif:https://fonts.googleapis.com/css2?family=Noto+Serif:wght@500;600&display=swap"
headingFontWeights = [600, 600, 600, 600, 600, 600]
baseRadius = "small"
showWidgetBorder = true
showSidebarBorder = true
chartCategoricalColors = ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#008300", "#4a3aa7", "#e34948"]

[theme.light]
primaryColor = "#1d4f91"
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#f1f2f4"
textColor = "#14171c"
borderColor = "#dcdee3"
dataframeHeaderBackgroundColor = "#eceef1"

[theme.light.sidebar]
backgroundColor = "#f1f2f4"

[theme.dark]
primaryColor = "#6fa3e8"
backgroundColor = "#121418"
secondaryBackgroundColor = "#1c1f25"
textColor = "#eceef2"
borderColor = "#2c3038"
dataframeHeaderBackgroundColor = "#1f232a"
chartCategoricalColors = ["#3987e5", "#d95926", "#199e70", "#c98500", "#d55181", "#008300", "#9085e9", "#e66767"]

[theme.dark.sidebar]
backgroundColor = "#17191e"

[client]
toolbarMode = "minimal"
